<style>
/* Layout: one mobile-first column for field officers; wider two-column grid for the admin on a laptop.
   Plain, cool, very light green. Text is bold everywhere. */
:root {
  --bg: #F0F8F1;          /* very light green page */
  --surface: #FFFFFF;
  --soft: #E2F2E6;        /* light green fill */
  --softer: #F6FBF7;
  --line: #CDE5D3;
  --accent: #A9DDB6;      /* light green buttons */
  --accent-press: #93D2A4;
  --accent-ink: #1E5A34;  /* dark green for links / focus */
  --ink: #15291C;
  --muted: #4C6855;
  --danger: #A8261C; --danger-soft: #FBE7E4;
  --warn: #7A5200;   --warn-soft: #FFF2D2;
  --star: #D99A00;
  --font: "Inter", "Noto Sans Telugu", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font); font-weight: 600; font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
h1, h2, h3 { font-weight: 800; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.45rem; } h2 { font-size: 1.15rem; } h3 { font-size: 1rem; }
p { margin: 0; }
a { color: var(--accent-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent-ink); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

/* shell */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.topbar-in, .wrap { width: 100%; max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body.admin .topbar-in, body.admin .wrap { max-width: 1080px; }
.topbar-in { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: var(--soft); display: grid; place-items: center; flex: none; }
.brand-t { min-width: 0; }
.brand-t b { display: block; font-weight: 800; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-t span { display: block; font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lang { display: flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; }
.lang button { border: 0; background: transparent; padding: 6px 10px; font-weight: 800; font-size: .85rem; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); }
.iconbtn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; flex: none; }
.wrap { padding-block: 16px 110px; display: grid; gap: 14px; }
.demo-bar { background: var(--warn-soft); color: var(--warn); font-size: .82rem; text-align: center; padding: 6px 16px; font-weight: 700; }

.bottomnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.bottomnav-in { max-width: 640px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
body.admin .bottomnav-in { max-width: 1080px; }
.bottomnav a { text-decoration: none; color: var(--muted); display: grid; justify-items: center; gap: 2px; padding: 8px 2px 10px; font-size: .74rem; font-weight: 800; text-align: center; }
.bottomnav a svg { width: 24px; height: 24px; }
.bottomnav a[aria-current="page"] { color: var(--ink); }
.bottomnav a[aria-current="page"] .ni { background: var(--accent); }
.ni { padding: 3px 16px; border-radius: 999px; display: grid; place-items: center; }

/* blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card.soft { background: var(--soft); border-color: transparent; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; text-decoration: none; color: inherit; }
.tile b { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.tile span { font-size: .82rem; color: var(--muted); }

.btn { appearance: none; border: 0; border-radius: 12px; min-height: 50px; padding: 12px 18px; font-weight: 800; font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--ink); background: var(--accent); }
.btn:active { background: var(--accent-press); }
.btn.block { width: 100%; }
.btn.big { min-height: 60px; font-size: 1.08rem; }
.btn.ghost { background: var(--surface); border: 1.5px solid var(--line); }
.btn.soft { background: var(--soft); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.wa { background: #DDF5E3; border: 1.5px solid #B5E3C2; }
.btn.sm { min-height: 40px; padding: 8px 12px; font-size: .9rem; border-radius: 10px; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn svg { width: 20px; height: 20px; flex: none; }

.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 10px; font-size: .78rem; font-weight: 800; background: var(--soft); color: var(--accent-ink); white-space: nowrap; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.danger { background: var(--danger-soft); color: var(--danger); }
.chip.plain { background: var(--softer); color: var(--muted); border: 1px solid var(--line); }
.stars { color: var(--star); letter-spacing: 1px; font-size: 1rem; white-space: nowrap; }
.stars .off { color: #D5DDD7; }

/* forms */
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .lbl, fieldset > legend { font-weight: 800; font-size: .95rem; }
.req { color: var(--danger); }
input[type=text], input[type=tel], input[type=password], input[type=date], input[type=url], input[type=search], select, textarea {
  width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; font-weight: 700; min-height: 50px; }
textarea { min-height: 96px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent-ink); outline: none; box-shadow: 0 0 0 3px var(--soft); }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 0; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.opt span { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 800; font-size: .93rem; }
.opt input:checked + span { background: var(--accent); border-color: var(--accent-press); }
.opt input:focus-visible + span { outline: 3px solid var(--accent-ink); outline-offset: 2px; }
.starpick { display: flex; gap: 6px; flex-wrap: wrap; }
.starpick .opt span { font-size: 1.3rem; min-width: 52px; justify-content: center; color: #C9D3CC; padding: 6px 10px; }
.starpick .opt input:checked + span { color: var(--star); background: var(--warn-soft); border-color: #F0D28A; }
.starpick .opt.lit span { color: var(--star); }
.hint { font-size: .82rem; color: var(--muted); }
.section-t { font-size: .8rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.err { background: var(--danger-soft); color: var(--danger); border-radius: 12px; padding: 10px 14px; font-weight: 800; }
.ok { background: var(--soft); color: var(--accent-ink); border-radius: 12px; padding: 10px 14px; font-weight: 800; }
.hide { display: none !important; }

.media { display: grid; gap: 10px; }
.media img { width: 100%; max-height: 320px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); background: var(--soft); }
.thumb { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; border: 1px solid var(--line); background: var(--soft); flex: none; }
audio { width: 100%; }
.rec-on { background: var(--danger-soft) !important; color: var(--danger) !important; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }

/* lists */
.list { display: grid; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; text-decoration: none; color: inherit; min-width: 0; }
.item:active { background: var(--softer); }
.item .t { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.item .t b { font-weight: 800; font-size: 1.02rem; min-width: 0; overflow-wrap: anywhere; }
.item .s { font-size: .85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.empty { text-align: center; padding: 26px 16px; color: var(--muted); border: 1.5px dashed var(--line); border-radius: var(--r); }

.kv { display: grid; grid-template-columns: minmax(120px, 40%) 1fr; gap: 0; border-top: 1px solid var(--line); }
.kv > div { padding: 9px 0; border-bottom: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
.kv > div:nth-child(odd) { color: var(--muted); font-size: .9rem; padding-right: 10px; }
.kv > div:nth-child(even) { font-weight: 800; }

.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 120px 1fr 36px; gap: 10px; align-items: center; font-size: .88rem; }
.bar .track { background: var(--softer); border: 1px solid var(--line); border-radius: 8px; height: 18px; overflow: hidden; }
.bar .fill { background: var(--accent); height: 100%; border-radius: 0 6px 6px 0; }
.bar b { text-align: right; font-variant-numeric: tabular-nums; }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: .9rem; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--softer); font-weight: 800; color: var(--muted); font-size: .8rem; }
tr:last-child td { border-bottom: 0; }

.ver { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; background: var(--softer); }
.diff { display: grid; grid-template-columns: minmax(110px, 30%) 1fr 1fr; gap: 6px 10px; font-size: .88rem; }
.diff .old { color: var(--danger); text-decoration: line-through; overflow-wrap: anywhere; }
.diff .new { color: var(--accent-ink); font-weight: 800; overflow-wrap: anywhere; }

.login { min-height: 100%; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.login .card { width: 100%; max-width: 420px; gap: 16px; padding: 22px; }
.login-head { display: grid; justify-items: center; gap: 6px; text-align: center; }
.login-head .logo { width: 64px; height: 64px; border-radius: 18px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 800; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.15); }
.confirm { position: fixed; inset: 0; z-index: 60; background: rgba(21,41,28,.35); display: grid; place-items: center; padding: 16px; }
.confirm .card { max-width: 400px; width: 100%; }
.loading { padding: 40px; text-align: center; color: var(--muted); }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.filters input, .filters select { min-height: 44px; padding: 8px 12px; }
@media (max-width: 420px) { .bar { grid-template-columns: 92px 1fr 30px; } .diff { grid-template-columns: 1fr; gap: 2px; } .diff .dh { display: none; } .diff .lbl2 { font-weight: 800; margin-top: 8px; } .diff .old::before, .diff .new::before { content: attr(data-pre); color: var(--muted); font-weight: 600; display: inline-block; text-decoration: none; } }

function confirmBox(msg) {
  return new Promise(res => {
    const w = document.createElement('div'); w.className = 'confirm';
    w.innerHTML = `<div class="card" role="dialog" aria-modal="true"><p>${esc(msg)}</p><div class="row"><button class="btn" id="cf-yes">${t('yesDo')}</button><button class="btn ghost" id="cf-no">${t('cancel')}</button></div></div>`;
    document.body.appendChild(w);
    const done = v => { w.remove(); res(v); };
    $('#cf-yes', w).onclick = () => done(true); $('#cf-no', w).onclick = () => done(false);
    $('#cf-yes', w).focus();
  });
}
function getGeo(timeout = 12000) {
  return new Promise(res => {
    try {
      if (!navigator.geolocation) return res(null);
      navigator.geolocation.getCurrentPosition(
        p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy || 0) }),
        () => res(null), { enableHighAccuracy: true, timeout, maximumAge: 30000 });
    } catch (e) { res(null); }
  });
}

async function stampPhoto(file, geo, label) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
    const max = 1280, sc = Math.min(1, max / Math.max(img.width, img.height));
    const w = Math.round(img.width * sc), h = Math.round(img.height * sc);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0, w, h);

    const path = `${S.me.id}/${kind}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;

  async customer(id) { return this.chk(await this.sb.from('customers').select('*').eq('id', id).maybeSingle()); },

    return r.data;
  },

  async setBlocked(id, blocked) { await this.fn({ action: 'block', user_id: id, blocked }); },

  const nm = c.name.replace(/\s*\(నమూనా\)/, '');
  const msg = {
    insta: S.lang === 'te' ? `నమస్కారం ${nm} గారు, గ్రీన్ వ్యాలీ (ఓంకార గ్రూప్స్) నుండి. మా వెంచర్ ఫోటోలు, వీడియోలు ఇక్కడ చూడండి: ${st.instagram_url}${office}` : `Hello ${nm}, greetings from Green Valley (Omkara Groups). See our venture photos and videos here: ${st.instagram_url}${office}`,
    web: S.lang === 'te' ? `నమస్కారం ${nm} గారు, గ్రీన్ వ్యాలీ కొత్త అప్‌డేట్స్ మా వెబ్‌సైట్‌లో చూడండి: ${st.website_url}${office}` : `Hello ${nm}, see the latest Green Valley updates on our website: ${st.website_url}${office}`,
    visit: S.lang === 'te' ? `నమస్కారం ${nm} గారు, గ్రీన్ వ్యాలీ సైట్ విజిట్${c.site_visit_date ? ' ' + fmtDate(c.site_visit_date) + ' న' : ''} ఏర్పాటు చేస్తున్నాం. మీకు ఏ టైం వీలవుతుందో చెప్పండి.${office}` : `Hello ${nm}, we are arranging your Green Valley site visit${c.site_visit_date ? ' on ' + fmtDate(c.site_visit_date) : ''}. Please tell us a suitable time.${office}`,
    follow: S.lang === 'te' ? `నమస్కారం ${nm} గారు, గ్రీన్ వ్యాలీ గురించి ఆలోచించారా? ఏమైనా సందేహాలు ఉంటే మాకు చెప్పండి.${office}` : `Hello ${nm}, have you thought about Green Valley? Let us know if you have any questions.${office}`,
  };
  const u = m => `https://wa.me/${p}?text=${encodeURIComponent(m)}`;
  return { insta: st.instagram_url ? u(msg.insta) : null, web: st.website_url ? u(msg.web) : null, visit: u(msg.visit), follow: u(msg.follow) };

function kvRows(c) {
  const yn = (g, v) => v ? opt(g, v) : '—';
  const rows = [
    ['phone', `<span class="num">${esc(c.phone)}</span>`],
    ['village', esc(c.village || '—')], ['mandal', esc(c.mandal || '—')], ['district', esc(c.district || '—')],
    ['occupation', esc(c.occupation === 'other' ? (c.occupation_other || opt('occupation', 'other')) : yn('occupation', c.occupation))],
    ['education', esc(yn('education', c.education))], ['financial', esc(yn('financial_status', c.financial_status))],
    ['children', esc(yn('children_status', c.children_status) + (c.children_status === 'studying' && c.children_place ? ' – ' + opt('children_place', c.children_place) : ''))],
    ['source', esc(yn('source', c.source) + (c.source_detail ? ' – ' + c.source_detail : ''))],
    ['interestItems', esc((c.interest_items || []).map(x => opt('interest_items', x)).join(', ') || '—')],
    ['buying', esc(yn('buying_interest', c.buying_interest))], ['budget', esc(c.budget ? '₹ ' + c.budget : '—')],
    ['emi', esc(yn('emi', c.emi))], ['payment', esc(yn('payment_mode', c.payment_mode) + (c.payment_mode === 'time' && c.payment_time ? ' – ' + c.payment_time : ''))],
    ['vision', esc(c.vision || '—')], ['feel', esc(yn('feel', c.feel))], ['stars', starsView(c.stars)],
    ['willContact', esc(yn('will_contact', c.will_contact))], ['askedConstr', esc(yn('asked_construction', c.asked_construction))],
    ['siteVisit', c.site_visit_date ? fmtDate(c.site_visit_date) : '—'], ['followUp', c.follow_up_date ? fmtDate(c.follow_up_date) : '—'],
    ['note', esc(c.note || '—')],
  ];
  return `<div class="kv">${rows.map(([k, v]) => `<div>${t(k)}</div><div>${v}</div>`).join('')}</div>`;
}

function fmtVal(f, v) {
  if (v == null || v === '' || (Array.isArray(v) && !v.length)) return '—';
  if (f === 'interest_items') return v.map(x => opt('interest_items', x)).join(', ');
  if (OPTS[f]) return opt(f, v);
  if (f === 'stars') return '★'.repeat(v);
  if (f.endsWith('_date')) return fmtDate(v);
  if (f === 'audio_path' || f === 'photo_path') return S.lang === 'te' ? 'ఫైల్' : 'file';
  return String(v);
}

function teamToday(ev, cs, day) {
  return S.users.filter(u => u.role !== 'admin').map(u => {
    const e = ev.filter(x => x.user_id === u.id && localDay(x.at) === day);
    return { u, login: e.filter(x => x.kind === 'login').pop(), start: e.filter(x => x.kind === 'field_start').pop(), end: e.filter(x => x.kind === 'field_end')[0], n: cs.filter(c => c.created_by === u.id && localDay(c.created_at) === day).length };
  });
}
function barsHtml(pairs) {
  const max = Math.max(1, ...pairs.map(p => p[1]));
  return `<div class="bars">${pairs.map(([l, n]) => `<div class="bar"><span>${l}</span><div class="track"><div class="fill" style="width:${(n / max) * 100}%"></div></div><b>${n}</b></div>`).join('')}</div>`;
}

async function toggleRec() {
  const btn = $('#rec-btn');
  if (S.rec) { S.rec.stop(); return; }
  try {
    if (!navigator.mediaDevices || !window.MediaRecorder) throw new Error('no');
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const type = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(x => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(x)) || '';
    const r = new MediaRecorder(stream, type ? { mimeType: type } : undefined); const parts = []; let secs = 0;
    const tick = setInterval(() => { secs++; const l = $('#rec-lbl'); if (l) l.textContent = `${t('stop')}  ${Math.floor(secs / 60)}:${pad(secs % 60)}`; }, 1000);
    r.ondataavailable = e => e.data.size && parts.push(e.data);
    r.onstop = () => { clearInterval(tick); stream.getTracks().forEach(x => x.stop()); S.rec = null; btn.classList.remove('rec-on'); const old = btn.querySelector('.dot'); if (old) old.remove(); if (parts.length) setAudio(new Blob(parts, { type: r.mimeType || 'audio/webm' })); else $('#rec-lbl').textContent = t('mic'); };
    r.start(); S.rec = r;
    btn.classList.add('rec-on'); btn.insertAdjacentHTML('afterbegin', '<span class="dot" aria-hidden="true"></span>'); $('#rec-lbl').textContent = `${t('stop')}  0:00`;
  } catch (e) {
    toast(t('micDenied')); $('#audio-pick').classList.remove('hide');
  }
}

async function saveCustomer(f) {
  const fd = new FormData(f), g = n => (fd.get(n) || '').toString().trim();
  const rec = {};
  ['name', 'phone', 'village', 'mandal', 'district', 'occupation', 'occupation_other', 'education', 'financial_status', 'children_status', 'children_place', 'source', 'source_detail', 'buying_interest', 'budget', 'emi', 'payment_mode', 'payment_time', 'vision', 'feel', 'will_contact', 'asked_construction', 'note'].forEach(n => rec[n] = g(n));
  rec.interest_items = fd.getAll('interest_items');
  rec.stars = g('stars') ? +g('stars') : null;
  rec.site_visit_date = g('site_visit_date') || null; rec.follow_up_date = g('follow_up_date') || null;
  if (rec.occupation !== 'other') rec.occupation_other = '';
  if (rec.children_status !== 'studying') rec.children_place = '';
  if (!['person', 'other'].includes(rec.source)) rec.source_detail = '';
  if (rec.payment_mode !== 'time') rec.payment_time = '';
  const digits = rec.phone.replace(/\D/g, '').replace(/^91(?=\d{10}$)/, '');
  const errBox = $('#form-err');
  const fail = (msg, id) => { errBox.innerHTML = `<div class="err" role="alert">${esc(msg)}</div>`; const el = $(id); if (el) { el.scrollIntoView({ block: 'center' }); if (el.focus) el.focus(); } };
  if (!rec.name) return fail(t('needName'), '#f-name');
  if (digits.length !== 10) return fail(t('needPhone'), '#f-phone');
  if (!rec.stars) return fail(t('needStars'), '#fs-stars');
  rec.phone = digits;
  errBox.innerHTML = '';
  const btn = $('#save-btn'); btn.disabled = true; btn.textContent = t('saving');
  try {
    const id = f.dataset.id;
    const geo = await getGeo(8000);
    if (S.draft.photo) { rec.photo_path = await DB.upload('customer-photo', S.draft.photo.blob); rec.photo_lat = S.draft.photo.geo ? S.draft.photo.geo.lat : null; rec.photo_lng = S.draft.photo.geo ? S.draft.photo.geo.lng : null; rec.photo_time = S.draft.photo.time; }
    if (S.draft.audio) rec.audio_path = await DB.upload('voice-note', S.draft.audio);
    if (!id) { rec.saved_lat = geo ? geo.lat : null; rec.saved_lng = geo ? geo.lng : null; }
    const c = id ? await DB.updateCustomer(id, rec) : await DB.addCustomer(rec);
    S.draft = {};
    toast(t('saved'));
    location.hash = id ? 'c-' + c.id : 'saved-' + c.id;
  } catch (e) {
    btn.disabled = false; btn.textContent = t('save');
    if (e.message === 'BLOCKED') return handleErr(e);
    errBox.innerHTML = `<div class="err" role="alert">${esc(errText(e))}</div>`;
  }
}

window.addEventListener('hashchange', show);

/* ---------------- start ---------------- */
(async () => {
  document.documentElement.lang = S.lang;
  try {
    if (LIVE) await Live.init(); else Demo.init();
    S.me = await DB.restore();
    if (S.me) await afterLogin();
  } catch (e) { S.me = null; }
  show();
})();
window.__gv = { S, DB, LIVE };
})();
</script>
